name: Release checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install --upgrade pip
      - run: pip install torch==2.14.1+cpu torchvision==0.29.1+cpu --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      - run: pip install -r backend/requirements-dev.txt
      - run: pip check
      - run: python scripts/audit-python.py
      - run: pytest -q
        working-directory: backend
      - run: |
          python - <<'PY'
          from ultralytics import YOLO
          from PIL import Image
          results = YOLO('yolo11n.yaml').predict(Image.new('RGB', (64, 64)), imgsz=64, device='cpu', verbose=False)
          assert len(results) == 1
          print('CPU inference engine smoke passed; synthetic model is not a quality evaluation')
          PY

  migration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_DB: ssdd_ci
          POSTGRES_USER: ssdd_ci
          POSTGRES_PASSWORD: ssdd_ci_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ssdd_ci -d ssdd_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DEBUG: 'true'
      DB_HOST: 127.0.0.1
      DB_NAME: ssdd_ci
      DB_USER: ssdd_ci
      DB_PASSWORD: ssdd_ci_password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install --upgrade pip
      - run: pip install torch==2.14.1+cpu torchvision==0.29.1+cpu --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      - run: pip install -r requirements.txt
        working-directory: backend
      - run: python -m alembic upgrade head
        working-directory: backend
      - run: python -m alembic current && python -m alembic heads
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm audit
        working-directory: frontend
      - run: npm run test:run
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  source-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          mkdir -p /tmp/gitleaks
          cd /tmp/gitleaks
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          sha256sum --ignore-missing -c gitleaks_8.30.1_checksums.txt
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz
      - run: /tmp/gitleaks/gitleaks git --redact=100 --log-opts='--all --no-textconv' .
      - run: python scripts/package-release.py
      - run: |
          python - <<'PY'
          import importlib.util, zipfile
          spec = importlib.util.spec_from_file_location('packaging', 'scripts/package-release.py')
          module = importlib.util.module_from_spec(spec); spec.loader.exec_module(module)
          with zipfile.ZipFile('dist/steel-defect-agent-v0.1.0.zip') as archive:
              assert archive.testzip() is None
              assert all(not module.excluded(name.removeprefix('steel-defect-agent/')) for name in archive.namelist())
              assert 'steel-defect-agent/scripts/start.ps1' in archive.namelist()
          print('Source package contents and ZIP integrity passed')
          PY

  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/configure.py --production --origin https://ci.example.com
      - run: docker compose --env-file .env.production -f docker-compose.prod.yml config --quiet
      - run: docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build --wait --wait-timeout 300
      - run: python scripts/smoke-stack.py
      - run: |
          docker compose --env-file .env.production -f docker-compose.prod.yml exec -T backend python - <<'PY'
          from ultralytics import YOLO
          from PIL import Image
          results = YOLO('yolo11n.yaml').predict(Image.new('RGB', (64, 64)), imgsz=64, device='cpu', verbose=False)
          assert len(results) == 1
          print('Container CPU inference smoke passed')
          PY
      - if: failure()
        run: docker compose --env-file .env.production -f docker-compose.prod.yml logs --tail 100
      - if: always()
        run: docker compose --env-file .env.production -f docker-compose.prod.yml down -v
